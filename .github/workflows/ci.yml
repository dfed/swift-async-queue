name: CI

on:
  push:
    branches:
    - main
  schedule:
    # Runs at 00:00 UTC every Monday to ensure that CI does not bitrot.
    - cron: '0 0 * * 1'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job names omit tool and OS versions so that branch protection's required checks survive toolchain updates.
  spm:
    name: Build Xcode
    # The `xcode-27` image ships Xcode 27.2 with its simulator runtimes installed.
    runs-on: xcode-27
    # A test that deadlocks keeps the test run from ending, so stop the
    # job after 50 minutes rather than at GitHub's six-hour default.
    timeout-minutes: 50
    strategy:
      matrix:
        platforms: [
          'iOS,watchOS',
          'macOS,tvOS',
          'visionOS'
        ]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - name: Build and Test Framework
        run: Scripts/build.swift ${{ matrix.platforms }}
      - name: Prepare Coverage Reports
        run: ./Scripts/prepare-coverage-reports.sh
      - name: Upload Coverage Reports
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
      # A test process that crashes, such as one in a simulator, fails
      # the job without saying why in the log. The test results and the
      # crash reports that macOS writes for the process explain it.
      - name: Upload Test Results and Crash Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-results-${{ matrix.platforms }}
          path: |
            .build/derivedData/*/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7
  # Xcode 27 can't download the iOS 18 simulator runtime, but the
  # `macos-15` image has it installed, so this job copies its disk image
  # and passes it to `spm-minimum-ios` as an artifact.
  minimum-ios-runtime:
    name: Copy Minimum iOS Simulator
    runs-on: macos-15
    # Copying and uploading the 9 GB disk image takes a few minutes, so
    # stop a stalled upload after 15 minutes rather than at GitHub's
    # six-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Copy the Simulator Runtime
        run: Scripts/copy-ios-18-simulator.sh runtime
      - name: Upload the Simulator Runtime
        uses: actions/upload-artifact@v7
        with:
          name: ios-18-simulator-runtime
          path: runtime
          # Skip compressing the 9 GB disk image, which only slows the upload.
          compression-level: 0
          # Only `spm-minimum-ios` needs the image, minutes later.
          retention-days: 1
  spm-minimum-ios:
    name: Build Xcode Minimum iOS
    needs: minimum-ios-runtime
    runs-on: xcode-27
    # A test that deadlocks keeps the test run from ending, so stop the
    # job after 50 minutes rather than at GitHub's six-hour default.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - name: Download the Simulator Runtime
        uses: actions/download-artifact@v8
        with:
          name: ios-18-simulator-runtime
          path: runtime
      - name: Install the Simulator Runtime
        run: Scripts/install-ios-18-simulator.sh runtime/iphonesimulator_18.5_22F77.dmg
      - name: Build and Test Framework
        run: Scripts/build.swift iOS18
      - name: Prepare Coverage Reports
        run: ./Scripts/prepare-coverage-reports.sh
      - name: Upload Coverage Reports
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
      # A test process that crashes, such as one in a simulator, fails
      # the job without saying why in the log. The test results and the
      # crash reports that macOS writes for the process explain it.
      - name: Upload Test Results and Crash Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-results-iOS18
          path: |
            .build/derivedData/*/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7
  spm-swift:
    name: Swift Build Xcode
    runs-on: xcode-27
    # A test that deadlocks keeps the test run from ending, so stop the
    # job after 15 minutes rather than at GitHub's six-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - name: Build and Test Framework
        run: xcrun swift test -c release -Xswiftc -enable-testing
      # A test process that crashes fails the job without saying why in
      # the log. The crash report that macOS writes for it explains it.
      - name: Upload Crash Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-build-xcode-crash-reports
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7
  tsan:
    name: "Thread Sanitizer on macOS"
    runs-on: xcode-27
    # A test that deadlocks keeps the test run from ending, so stop the
    # job after 15 minutes rather than at GitHub's six-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - name: Build With Thread Sanitizer
        run: xcrun swift build --build-tests --sanitize=thread
      # When Thread Sanitizer reports a data race, the test process exits
      # with an error, which fails this step.
      - name: Test With Thread Sanitizer
        run: xcrun swift test --skip-build --sanitize=thread
      # A test process that crashes fails the job without saying why in
      # the log. The crash report that macOS writes for it explains it.
      - name: Upload Crash Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thread-sanitizer-crash-reports
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7
  linux:
    name: "Build and Test on Linux"
    runs-on: ubuntu-24.04
    container: swift:6.4
    # A test that deadlocks keeps the test run from ending, so stop the
    # job after 15 minutes rather than at GitHub's six-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # Coverage counters are plain loads and stores, and Swift Testing
      # runs tests in parallel, so a counter that several tests update
      # can lose an increment. llvm-cov counts some regions, such as an
      # `else` branch or the code after a `guard`, by subtracting one
      # counter from another, so a region that ran can read zero.
      # `-instrprof-atomic-counter-update-all` makes every update
      # atomic, so the counts are exact. A build system can drop the
      # flag, which the next step catches.
      - name: Build and Test Framework
        run: swift test -c release --enable-code-coverage -Xswiftc -enable-testing -Xswiftc -Xllvm -Xswiftc -instrprof-atomic-counter-update-all
      # A release build compiles out the tests under `#if DEBUG`, which
      # use test hooks that only debug builds have, so run the tests in
      # a debug build too.
      - name: Test Debug Build
        run: swift test
      # Fails unless the test binary updates coverage counters and
      # every update is atomic. It reads x86_64 code: an atomic update
      # follows a `lock` prefix, which llvm-objdump prints on its own
      # line, and `leaq` only takes a counter's address. On another
      # architecture it finds no `lock` and fails. The disassembly goes
      # to a file rather than a pipe, so that a missing llvm-objdump or
      # test binary fails the step with llvm-objdump's own error.
      - name: Check Atomic Coverage Counters
        run: |
          BIN_PATH=$(swift build -c release --show-bin-path)
          llvm-objdump -d --no-show-raw-insn "$BIN_PATH/AsyncQueueTests.so" > .build/disassembly.txt
          awk '
            /<__profc_/ && $2 != "leaq" { if (previous == "lock") atomic++; else plain++ }
            { previous = $2 }
            END {
              if (plain > 0) print "::error::" plain " coverage counter updates in the test binary are not atomic."
              if (atomic == 0) print "::error::The test binary has no atomic coverage counter updates."
              print atomic + 0 " atomic and " plain + 0 " non-atomic coverage counter updates."
              exit (plain > 0 || atomic == 0)
            }' .build/disassembly.txt
      - name: Prepare Coverage Reports
        # Swift 6.4 builds with Swift Build, which links the tests into `AsyncQueueTests.so`.
        run: |
          BIN_PATH=$(swift build -c release --show-bin-path)
          llvm-cov export -format="lcov" "$BIN_PATH/AsyncQueueTests.so" -instr-profile "$BIN_PATH/codecov/default.profdata" > coverage.lcov
      - name: Install curl for Codecov
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
      - name: Upload Coverage Reports
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
  linux-latest-swift:
    name: "Build and Test on Latest Swift"
    runs-on: ubuntu-24.04
    # `swift:latest` floats to the newest Swift release so this job
    # catches toolchain changes before anyone pins to them. Coverage is
    # collected by the pinned jobs only, so a different toolchain can't
    # skew the report.
    container: swift:latest
    # A test that deadlocks keeps the test run from ending, so stop the
    # job after 15 minutes rather than at GitHub's six-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Print Swift Version
        run: swift --version
      - name: Build and Test Framework
        run: swift test -c release -Xswiftc -enable-testing
  readme-validation:
    name: Check Markdown links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Link Checker
        uses: AlexanderDokuchaev/md-dead-link-check@5b5641a92ec95d13a5b04927e0e11de5c3405298 # v1.3.0
  lint-swift:
    name: Lint Swift
    runs-on: ubuntu-latest
    container: swift:6.4
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # `swift run` otherwise compiles SwiftFormat from source on every
      # run. Keyed on the container's Swift version.
      - name: Cache SwiftFormat Build
        uses: actions/cache@v6
        with:
          path: CLI/.build
          key: swiftformat-${{ runner.os }}-swift-6.4-${{ hashFiles('CLI/Package.resolved') }}
      - name: Lint Swift
        run: swift run --package-path CLI swiftformat . --lint
